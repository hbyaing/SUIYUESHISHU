<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>荒芜之噬 · 特效预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#090c15;color:#e7e8f5;font:15px "Microsoft YaHei",sans-serif}header{position:absolute;z-index:2;left:36px;top:26px;pointer-events:none}h1{font-size:25px;letter-spacing:4px;margin:0 0 10px}header p{color:#a2acc5;font-size:13px}canvas{width:100vw;height:calc(100vh - 124px);display:block;touch-action:none}footer{height:124px;padding:18px 36px;background:#101421;border-top:1px solid #273049}button{background:#354d74;color:#fff;border:0;border-radius:6px;padding:9px 20px;cursor:pointer}input[type=range]{width:calc(100% - 280px);margin:0 22px;accent-color:#83e8ff}#phase{display:inline-block;min-width:130px;color:#a6f0ff}small{display:block;margin-top:14px;color:#99a6bd}#loading{position:absolute;top:45%;left:43%;color:#8bdfff}#time{float:right;font-variant-numeric:tabular-nums}</style>
<header><h1>荒芜之噬</h1><p>冥古龙 · 蓝白奇点 / 红紫旋涡 / 收缩爆发</p></header>
<canvas id="c"></canvas><div id="loading">正在加载共享几何…</div>
<footer><button id="play">暂停</button><input id="seek" type="range" min="0" max="4.32" step="0.04" value="0"><span id="phase">能量聚集</span><span id="time">0.00 s</span><small>拖动旋转 · 滚轮缩放 · 时间轴逐帧查看 ｜ 本预览读取 Forge 使用的同一份程序几何，不包含玩家或生物动作。</small></footer>
<script type="module">
const canvas=document.getElementById('c'),gl=canvas.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
if(!gl)throw Error('需要 WebGL 2');
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,`#version 300 es
in vec3 pos;in vec4 color;uniform mat4 vp;out vec4 col;void main(){gl_Position=vp*vec4(pos,1);col=color;}`));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,`#version 300 es
precision highp float;in vec4 col;out vec4 frag;void main(){frag=col;}`));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const vpLoc=gl.getUniformLocation(program,'vp'),vbo=gl.createBuffer(),vao=gl.createVertexArray();gl.bindVertexArray(vao);gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
let loc=gl.getAttribLocation(program,'pos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,28,0);loc=gl.getAttribLocation(program,'color');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,4,gl.FLOAT,false,28,12);
const sub=(a,b)=>a.map((x,i)=>x-b[i]),dot=(a,b)=>a.reduce((s,x,i)=>s+x*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],unit=a=>a.map(x=>x/Math.hypot(...a));
function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
function camera(yaw,pitch,dist){let eye=[Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist],z=unit(eye),x=unit(cross([0,1,0],z)),y=cross(z,x),view=new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1]);let f=1/Math.tan(.62/2),asp=canvas.width/canvas.height,p=new Float32Array([f/asp,0,0,0,0,f,0,0,0,0,-1.002,-1,0,0,-.2002,0]);return mul(p,view)}
const download=await fetch('frames.bin.gz');if(!download.ok)throw Error('无法加载几何');const raw=await new Response(download.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(),dv=new DataView(raw);let offset=4,frames=[];for(let k=0;k<dv.getUint32(0,true);k++){let sets=[];for(let j=0;j<2;j++){let count=dv.getUint32(offset,true);offset+=4;sets.push(new Float32Array(raw,offset,count*7));offset+=count*28}frames.push(sets)}
if(offset!==raw.byteLength)throw Error('共享几何长度不符');
window.previewInfo={frames:frames.length,bytes:raw.byteLength};document.getElementById('loading').remove();
let yaw=.34,pitch=.22,dist=10,playing=true,t=0,last=performance.now();const seek=document.getElementById('seek'),play=document.getElementById('play');
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};seek.oninput=()=>{t=+seek.value;playing=false;play.textContent='播放';draw()};
let drag;canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw-=(e.clientX-drag[0])*.007;pitch=Math.max(-.7,Math.min(1.2,pitch+(e.clientY-drag[1])*.007));drag=[e.clientX,e.clientY];draw()};canvas.onwheel=e=>{e.preventDefault();dist=Math.max(4,Math.min(22,dist+e.deltaY*.01));draw()};
const grid=[];for(let i=-8;i<=8;i++)for(const p of [[i,-1.65,-8],[i,-1.65,8],[-8,-1.65,i],[8,-1.65,i]])grid.push(...p,.09,.12,.17,1);const ground=new Float32Array(grid);
function emit(data,mode){gl.bufferData(gl.ARRAY_BUFFER,data,gl.DYNAMIC_DRAW);gl.drawArrays(mode,0,data.length/7)}
function draw(){canvas.width=Math.round(canvas.clientWidth*devicePixelRatio);canvas.height=Math.round(canvas.clientHeight*devicePixelRatio);gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.025,.033,.052,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.uniformMatrix4fv(vpLoc,false,camera(yaw,pitch,dist));gl.depthMask(true);gl.disable(gl.BLEND);emit(ground,gl.LINES);const f=frames[Math.min(frames.length-1,Math.round(t/.04))];emit(f[0],gl.TRIANGLES);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);emit(f[1],gl.TRIANGLES);gl.depthMask(true);gl.disable(gl.BLEND);seek.value=t;document.getElementById('time').textContent=t.toFixed(2)+' s';document.getElementById('phase').textContent=t<.9?'能量聚集':t<2.18?'旋涡吞噬':t<2.65?'收缩闪爆':'碎晶消散';}
window.capture=(seconds,angle=.34,elevation=.22)=>{playing=false;t=seconds;yaw=angle;pitch=elevation;draw();return canvas.toDataURL('image/png')};
window.addEventListener('resize',draw);function tick(now){let dt=Math.min(.1,(now-last)/1000);last=now;if(playing)t=(t+dt)%4.32;draw();requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></html>
